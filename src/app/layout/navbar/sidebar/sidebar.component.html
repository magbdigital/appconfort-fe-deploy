<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo-mark">
      <i class="pi pi-box"></i>
    </div>
    <span class="logo-text">ConfortMueble</span>
  </div>

  <!-- Menú de Navegación -->
  <nav class="sidebar-nav">
    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      class="nav-item"
    >
      <i class="pi pi-chart-bar"></i>
      <span>Dashboard</span>
    </a>

    <a
      routerLink="/clients"
      routerLinkActive="active"
      class="nav-item"
    >
      <i class="pi pi-users"></i>
      <span>Clientes</span>
    </a>

    <a
      routerLink="/products"
      routerLinkActive="active"
      class="nav-item"
    >
      <i class="pi pi-tag"></i>
      <span>Productos</span>
    </a>

    <a
      routerLink="/furniture-sets"
      routerLinkActive="active"
      class="nav-item"
    >
      <i class="pi pi-th-large"></i>
      <span>Juegos</span>
    </a>

    <a
      routerLink="/orders"
      routerLinkActive="active"
      class="nav-item"
    >
      <i class="pi pi-file"></i>
      <span>Pedidos</span>
    </a>
  </nav>

  <!-- Footer del Sidebar -->
  <div class="sidebar-footer">
    <div class="user-info">
      <div class="user-avatar">
        <i class="pi pi-user"></i>
      </div>
      <div class="user-details">
        <span class="user-name">Administrador</span>
        <span class="user-role">Soporte</span>
      </div>
    </div>
    <p-button
      icon="pi pi-sign-out"
      [text]="true"
      severity="danger"
      pTooltip="Cerrar sesión"
      tooltipPosition="right"
      (onClick)="logout()"
      styleClass="logout-btn"
    />
  </div>
</aside>
