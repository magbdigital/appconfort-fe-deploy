<p-dialog 
  [header]="esEdicion() ? 'Editar Cliente' : 'Nuevo Cliente'" 
  [visible]="visible()" 
  (visibleChange)="onCerrar()"
  [modal]="true" 
  [style]="{ width: '450px' }" 
  [draggable]="false" 
  [resizable]="false"
>
  <div class="form-container">
    @if (errorMsg()) {
      <div class="error-message-banner" style="background-color: #fef2f2; color: #ef4444; border: 1px solid #fca5a5; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.875rem; display: flex; align-items: center; gap: 0.5rem; font-weight: 500;">
        <i class="pi pi-exclamation-triangle" style="font-size: 1rem;"></i>
        <span>{{ errorMsg() }}</span>
      </div>
    }

    <div class="field-group">
      <label for="nui">NUI</label>
      <input pInputText id="nui" [(ngModel)]="formData.nui" placeholder="0912345678" />
    </div>

    <div class="field-group">
      <label for="firstName">Nombres</label>
      <input pInputText id="firstName" [(ngModel)]="formData.firstName" placeholder="Carlos" />
    </div>

    <div class="field-group">
      <label for="lastName">Apellidos</label>
      <input pInputText id="lastName" [(ngModel)]="formData.lastName" placeholder="Mendoza" />
    </div>

    <div class="field-group">
      <label for="email">Email</label>
      <input pInputText id="email" type="email" [(ngModel)]="formData.email" placeholder="carlos@email.com" />
    </div>

    <div class="field-group">
      <label for="mobile">Celular</label>
      <input pInputText id="mobile" [(ngModel)]="formData.mobile" placeholder="0987654321" />
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="footer-container">
      @if (esEdicion()) {
        <p-button 
          [label]="confirmarEliminar() ? '¿Confirmar Eliminar?' : 'Eliminar'" 
          [severity]="confirmarEliminar() ? 'danger' : 'secondary'" 
          [text]="!confirmarEliminar()" 
          (onClick)="onEliminar()"
        ></p-button>
      } @else {
        <span></span>
      }
      <div class="actions-right">
        <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="onCerrar()"></p-button>
        <p-button label="Guardar" severity="primary" (onClick)="onGuardar()"></p-button>
      </div>
    </div>
  </ng-template>
</p-dialog>
