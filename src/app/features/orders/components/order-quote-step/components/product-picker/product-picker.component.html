<div class="product-picker-container">
    <!-- Search input -->
    <div class="search-input-wrapper">
        <input pInputText type="text" [ngModel]="searchText()" (ngModelChange)="searchText.set($event)"
            placeholder="Buscar producto..." />
    </div>

    <!-- Product list -->
    <div class="products-grid">
        @for (product of filteredProducts(); track product.id) {
        <p-card styleClass="product-picker-card">
            <!-- Thumbnail -->
            <div class="product-thumbnail">
                @if (product.imageUrl) {
                <img [src]="getProductImageUrl(product.imageUrl)" alt="producto" />
                } @else {
                <span class="placeholder-icon">🛋️</span>
                }
            </div>

            <!-- Info -->
            <div class="product-picker-info">
                <p class="product-picker-name" [title]="product.name">{{ product.name }}</p>
                <p class="product-picker-sku">SKU: {{ product.sku }}</p>
                <p class="product-picker-price">${{ product.finalPrice }}</p>
            </div>

            <!-- Controls & Action -->
            <div class="picker-controls-row">
                <!-- Quantity picker -->
                <div class="quantity-picker-box">
                    <button (click)="decrement(product.id)" class="qty-btn">−</button>
                    <span class="qty-display">{{ quantities[product.id] || 1 }}</span>
                    <button (click)="increment(product.id)" class="qty-btn">+</button>
                </div>

                <!-- Add Button -->
                <p-button icon="pi pi-plus" (onClick)="addProduct(product)" size="small"></p-button>
            </div>
        </p-card>
        }

        @if (filteredProducts().length === 0) {
        <div class="empty-products-box">
            <p>No se encontraron productos disponibles.</p>
        </div>
        }
    </div>
</div>
